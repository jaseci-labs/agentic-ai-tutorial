[project]
name = "jachacks-pitch-builder"
version = "0.1.0"
description = "Hackathon Pitch Builder — JacHacks agentic AI workshop"
jac-version = ">=0.37"
default-app = "jachacks-pitch-builder"

# One app: the web UI plus the server endpoints behind it. `jac run` serves it.
[apps.jachacks-pitch-builder]
kind = "web-app"
entry-point = "app"

[dependencies]

# The generated client runtime imports react, react-router-dom,
# react-error-boundary, zod and @tanstack/react-form — all must be present.
[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.0.0"
zod = "^4.3.6"
react-markdown = "^9.0.1"
remark-gfm = "^4.0.0"

[dependencies.npm.dev]
tailwindcss = "^4.1.17"
"@tailwindcss/vite" = "^4.1.17"
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[dev-dependencies.pypi]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

# Tailwind v4 runs as a Vite plugin; frontend/styles.css is its entry.
[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

# byLLM, the client framework, and the MCP server ship inside the `jac` binary.
# Configure them with top-level tables — the old [plugins.*] paths no longer parse.
[byllm.model]
default_model = "openrouter/anthropic/claude-haiku-4.5"
# api_key = "${OPENROUTER_API_KEY}"

[byllm.call_params]
temperature = 0.7
