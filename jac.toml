[project]
name = "jachacks-pitch-builder"
version = "0.1.0"
description = "Hackathon Pitch Builder — JacHacks agentic AI workshop"
entry-point = "app.jac"
jac-version = ">=0.34"

[dependencies]

# The generated client runtime imports react, react-router-dom,
# react-error-boundary, zod and @tanstack/react-form — all must be present.
[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.0.0"
zod = "^4.3.6"
react-markdown = "^9.0.1"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

# byLLM, the client framework, and the MCP server ship inside the `jac` binary.
# Configure them with top-level tables — the old [plugins.*] paths no longer parse.
[byllm.model]
default_model = "gpt-4o-mini"
api_key = "${OPENAI_API_KEY}"

[byllm.call_params]
temperature = 0.7
